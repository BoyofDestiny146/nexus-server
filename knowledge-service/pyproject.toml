[project]
name = "careconnect-knowledge"
version = "0.1.0"
description = "NEXUS Knowledge Fabric retrieval service — extract, chunk, embed, index, search"
requires-python = ">=3.10"
authors = [{name = "careconnect"}]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
