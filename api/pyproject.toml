[project]
name = "careconnect-api"
version = "0.1.0"
description = "careconnect FastAPI backend — admin app, RBAC, triage scheduler, WebSocket fan-out"
requires-python = ">=3.10"
authors = [{name = "careconnect"}]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiomysql>=0.2",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
  "httpx>=0.27",
  "redis>=5.0",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
  "cryptography>=42.0",
  "icalendar>=6.0",
  "python-dateutil>=2.9",
  "python-multipart>=0.0.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
