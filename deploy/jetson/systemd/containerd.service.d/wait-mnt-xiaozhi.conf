# Wait for the extra SSD at /mnt/xiaozhi before containerd opens its graph.
#
# Docker Root Dir on the Orin is /mnt/xiaozhi/docker-data. If containerd starts
# while /mnt/xiaozhi is still the empty pre-mount directory on the root fs, it
# initializes an empty image store (docker images shows little more than
# registry:2). Restarting containerd after the mount is up recovers the real
# data — this drop-in makes that order permanent.
#
# RequiresMountsFor adds Requires= + After= on the systemd mount unit
# (mnt-xiaozhi.mount from fstab). After=local-fs.target is not enough when the
# fstab line uses nofail: local-fs.target does not wait for optional mounts.
[Unit]
RequiresMountsFor=/mnt/xiaozhi
After=mnt-xiaozhi.mount
