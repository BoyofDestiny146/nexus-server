# Wait for the extra SSD at /mnt/xiaozhi before dockerd opens Root Dir.
#
# Docker Root Dir must stay /mnt/xiaozhi/docker-data (do not change data-root).
# Pair with containerd.service.d/wait-mnt-xiaozhi.conf — both daemons must see
# the mounted disk; restarting only docker is not enough if containerd still
# holds the empty pre-mount graph.
#
# Nexus containers use restart: unless-stopped, so they return once docker is
# up against the real data. Do not add a second compose auto-start unit.
[Unit]
RequiresMountsFor=/mnt/xiaozhi
After=mnt-xiaozhi.mount containerd.service
