[Service]
# Do NOT use OLLAMA_KEEP_ALIVE=-1. That pins every loaded model Forever and
# OOMs qwen2.5:3b on the Orin (cc-llm 5.5G + cc-vision 11G + nomic 0.6G).
# Default 5m: vision/embeddings unload after idle. Chat pins qwen via
# per-request keep_alive=-1 (see cc-warm-models.sh and OllamaLLM).
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=3"
Environment="OLLAMA_KEEP_ALIVE=5m"
